<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js Projects — Prakhar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0a0a;
    --fg:       #f0ece4;
    --fg-dim:   #6b6660;
    --violet:   #7c3aed;
    --coral:    #ff4d2e;
    --rule:     rgba(240,236,228,0.08);
  }

  html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', sans-serif;
    overflow-x: hidden;
    cursor: none;
  }

  /* ── Custom cursor ── */
  #cursor {
    position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
    width: 12px; height: 12px;
    background: var(--coral);
    border-radius: 50%;
    transform: translate(-50%,-50%);
    transition: width .15s, height .15s, background .15s;
  }
  #cursor.hover { width: 40px; height: 40px; background: var(--violet); mix-blend-mode: screen; }
  #cursor-ring {
    position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9998;
    width: 36px; height: 36px;
    border: 1px solid rgba(240,236,228,0.3);
    border-radius: 50%;
    transform: translate(-50%,-50%);
    transition: transform .08s linear;
  }

  /* ── Hero ── */
  #hero {
    scroll-snap-align: start;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 3rem 4rem;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--rule);
  }

  #ascii-bg {
    position: absolute; inset: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.45;
    color: rgba(124,58,237,0.18);
    white-space: pre;
    padding: 2rem;
    pointer-events: none;
    transition: transform 0.6s cubic-bezier(0.16,1,0.3,1);
    user-select: none;
  }

  .hero-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: .72rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--coral);
    margin-bottom: 1.2rem;
  }

  .hero-title {
    font-size: clamp(3rem, 8vw, 7rem);
    font-weight: 700;
    line-height: .95;
    letter-spacing: -.03em;
    max-width: 14ch;
    margin-bottom: 2rem;
  }

  .hero-title em {
    font-style: normal;
    color: var(--violet);
  }

  .hero-meta {
    display: flex;
    align-items: center;
    gap: 2rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: .75rem;
    color: var(--fg-dim);
  }

  .hero-meta span { display: flex; align-items: center; gap: .5rem; }
  .hero-meta span::before { content: ''; width: 20px; height: 1px; background: var(--fg-dim); }

  .scroll-hint {
    position: absolute;
    right: 4rem; bottom: 3rem;
    writing-mode: vertical-rl;
    font-family: 'JetBrains Mono', monospace;
    font-size: .68rem;
    letter-spacing: .18em;
    color: var(--fg-dim);
    text-transform: uppercase;
    display: flex; align-items: center; gap: .6rem;
  }
  .scroll-hint::after {
    content: '';
    display: block;
    width: 1px; height: 48px;
    background: linear-gradient(to bottom, var(--fg-dim), transparent);
    animation: scrollpulse 1.8s ease-in-out infinite;
  }
  @keyframes scrollpulse { 0%,100% { opacity:.3 } 50% { opacity:1 } }

  /* ── Project sections ── */
  .project {
    scroll-snap-align: start;
    height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--rule);
  }

  .project-number {
    position: absolute;
    right: -0.05em; top: -0.15em;
    font-size: clamp(16rem, 28vw, 26rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.06em;
    color: transparent;
    -webkit-text-stroke: 1px rgba(240,236,228,0.04);
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }

  .project-left {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 3rem 4rem;
    position: relative;
    z-index: 1;
  }

  .project-tag-row {
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: .65rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: .25rem .6rem;
    border: 1px solid var(--rule);
    color: var(--fg-dim);
    border-radius: 2px;
  }

  .tag.accent { border-color: var(--violet); color: var(--violet); }

  .project-title {
    font-size: clamp(2rem, 4.5vw, 3.8rem);
    font-weight: 700;
    line-height: 1.0;
    letter-spacing: -.025em;
    margin-bottom: 1.2rem;
  }

  .project-desc {
    font-size: 1rem;
    line-height: 1.65;
    color: rgba(240,236,228,0.6);
    max-width: 42ch;
    margin-bottom: 2.5rem;
  }

  .project-link {
    display: inline-flex;
    align-items: center;
    gap: .75rem;
    text-decoration: none;
    color: var(--fg);
    font-weight: 600;
    font-size: .9rem;
    letter-spacing: .01em;
    position: relative;
    width: fit-content;
  }
  .project-link::after {
    content: '';
    position: absolute;
    bottom: -3px; left: 0;
    width: 0; height: 2px;
    background: var(--coral);
    transition: width .3s cubic-bezier(0.16,1,0.3,1);
  }
  .project-link:hover::after { width: 100%; }
  .project-link .arrow {
    display: inline-block;
    transition: transform .3s cubic-bezier(0.16,1,0.3,1);
  }
  .project-link:hover .arrow { transform: translateX(6px); }

  .project-right {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem;
  }

  .project-preview {
    width: 100%;
    max-width: 480px;
    aspect-ratio: 16/10;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: #111;
    position: relative;
    overflow: hidden;
    transform: perspective(1000px) rotateY(-4deg) rotateX(2deg);
    transition: transform .5s cubic-bezier(0.16,1,0.3,1);
    box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
  }
  .project:hover .project-preview {
    transform: perspective(1000px) rotateY(0deg) rotateX(0deg);
  }

  .preview-inner {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: .7rem;
    color: rgba(240,236,228,0.15);
  }

  /* Animated placeholder stripes */
  .preview-inner::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 12px,
      rgba(124,58,237,0.04) 12px,
      rgba(124,58,237,0.04) 13px
    );
  }

  .preview-dot {
    position: absolute;
    top: .75rem; left: .75rem;
    display: flex; gap: 5px;
  }
  .preview-dot span {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(240,236,228,0.1);
  }

  /* ── Footer / End screen ── */
  #outro {
    scroll-snap-align: start;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 3rem 4rem;
    gap: 2rem;
    position: relative;
    overflow: hidden;
  }

  .outro-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: .72rem;
    letter-spacing: .2em;
    color: var(--fg-dim);
    text-transform: uppercase;
  }

  .outro-line {
    font-size: clamp(2.4rem, 6vw, 5.5rem);
    font-weight: 700;
    line-height: .95;
    letter-spacing: -.03em;
  }

  .outro-line .hl { color: var(--coral); }

  .outro-links {
    display: flex;
    gap: 2rem;
    margin-top: 1rem;
  }
  .outro-links a {
    font-family: 'JetBrains Mono', monospace;
    font-size: .8rem;
    color: var(--fg-dim);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 2px;
    transition: color .2s, border-color .2s;
  }
  .outro-links a:hover { color: var(--fg); border-color: var(--fg); }

  .outro-bg-text {
    position: absolute;
    bottom: -0.1em; right: -0.04em;
    font-size: clamp(12rem, 22vw, 20rem);
    font-weight: 700;
    letter-spacing: -.06em;
    color: transparent;
    -webkit-text-stroke: 1px rgba(255,77,46,0.06);
    pointer-events: none;
    user-select: none;
    line-height: 1;
  }

  /* ── Nav dots ── */
  #nav-dots {
    position: fixed;
    right: 2rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: .8rem;
    z-index: 100;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--fg-dim);
    cursor: none;
    transition: background .3s, transform .3s;
    position: relative;
  }
  .dot.active { background: var(--coral); transform: scale(1.5); }
  .dot[data-label]::before {
    content: attr(data-label);
    position: absolute;
    right: 16px; top: 50%;
    transform: translateY(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: .6rem;
    color: var(--fg-dim);
    white-space: nowrap;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
  }
  .dot:hover[data-label]::before { opacity: 1; }

  /* ── Reveal animations ── */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s cubic-bezier(0.16,1,0.3,1), transform .7s cubic-bezier(0.16,1,0.3,1); }
  .reveal.in { opacity: 1; transform: none; }
  .reveal:nth-child(2) { transition-delay: .08s; }
  .reveal:nth-child(3) { transition-delay: .16s; }
  .reveal:nth-child(4) { transition-delay: .24s; }
  .reveal:nth-child(5) { transition-delay: .32s; }

  @media (max-width: 768px) {
    .project { grid-template-columns: 1fr; }
    .project-right { display: none; }
    .project-left, #hero, #outro { padding: 2rem; }
    #nav-dots { display: none; }
    .scroll-hint { display: none; }
  }
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<!-- Nav dots -->
<nav id="nav-dots" aria-label="Section navigation"></nav>

<!-- ── HERO ── -->
<section id="hero" data-label="Index">
  <div id="ascii-bg"></div>
  <p class="hero-eyebrow reveal">WebGL / Three.js — Prakhar</p>
  <h1 class="hero-title reveal">Things I built <em>in 3D.</em></h1>
  <div class="hero-meta reveal">
    <span id="project-count">— projects</span>
    <span>Real-time rendering</span>
    <span>Browser-native</span>
  </div>
  <div class="scroll-hint">Scroll</div>
</section>

<!-- ── PROJECTS injected here by JS ── -->
<div id="projects-container"></div>

<!-- ── OUTRO ── -->
<section id="outro" data-label="End">
  <p class="outro-label reveal">Made with claude AI. I am not web dev.</p>
  <p class="outro-line reveal">More<br><span class="hl">shipping</span><br>soon.</p>
  <div class="outro-links reveal">
    <a href="https://github.com/praksharma" target="_blank">GitHub</a>
    <a href="dkms.smooth103@passinbox.com">Email</a>
  </div>
  <div class="outro-bg-text">GL</div>
</section>

<script>
// ─────────────────────────────────────────────
//  ★  EDIT YOUR PROJECTS HERE
// ─────────────────────────────────────────────
const PROJECTS = [
  {
    title: "Getting Started\nwith Three.js",
    description: "Exploring the fundamentals — scenes, cameras, geometries, and the render loop. The hello-world that kicked everything off.",
    tags: ["Three.js", "WebGL", "Geometry"],
    accentTag: "Three.js",
    href: "./getting-started-with-threejs/index.html",
    year: "2024",
  },
  // ── Add more projects below ──
  // {
  //   title: "Your Next Project",
  //   description: "Short description of what this explores.",
  //   tags: ["Three.js", "Shaders"],
  //   accentTag: "Shaders",
  //   href: "./your-project-folder/index.html",
  //   year: "2025",
  // },
];
// ─────────────────────────────────────────────

// Build project sections
const container = document.getElementById('projects-container');
document.getElementById('project-count').textContent =
  `${String(PROJECTS.length).padStart(2,'0')} project${PROJECTS.length !== 1 ? 's' : ''}`;

PROJECTS.forEach((p, i) => {
  const num = String(i + 1).padStart(2, '0');
  const titleHtml = p.title.replace(/\n/g, '<br>');
  const tagsHtml = p.tags.map(t =>
    `<span class="tag${t === p.accentTag ? ' accent' : ''}">${t}</span>`
  ).join('');

  const section = document.createElement('section');
  section.className = 'project';
  section.dataset.label = `${num}`;
  section.innerHTML = `
    <div class="project-number">${num}</div>
    <div class="project-left">
      <div class="project-tag-row reveal">${tagsHtml}
        <span class="tag">${p.year}</span>
      </div>
      <h2 class="project-title reveal">${titleHtml}</h2>
      <p class="project-desc reveal">${p.description}</p>
      <a class="project-link reveal" href="${p.href}" target="_blank">
        Open project <span class="arrow">→</span>
      </a>
    </div>
    <div class="project-right">
      <div class="project-preview">
        <div class="preview-dot"><span></span><span></span><span></span></div>
        <div class="preview-inner">[ live preview ]</div>
      </div>
    </div>
  `;
  container.appendChild(section);
});

// ── Nav dots ──
const sections = [document.getElementById('hero'), ...document.querySelectorAll('.project'), document.getElementById('outro')];
const navEl = document.getElementById('nav-dots');

sections.forEach((s, i) => {
  const d = document.createElement('button');
  d.className = 'dot';
  d.dataset.label = s.dataset.label || (i === 0 ? 'Index' : 'End');
  d.setAttribute('aria-label', `Go to section ${i + 1}`);
  d.addEventListener('click', () => s.scrollIntoView({ behavior: 'smooth' }));
  navEl.appendChild(d);
});

const dots = navEl.querySelectorAll('.dot');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const idx = sections.indexOf(e.target);
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    }
  });
}, { threshold: 0.5 });
sections.forEach(s => observer.observe(s));

// ── Reveal on scroll ──
const revealObs = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
}, { threshold: 0.15 });
document.querySelectorAll('.reveal').forEach(el => revealObs.observe(el));

// ── Custom cursor ──
const cursor = document.getElementById('cursor');
const ring   = document.getElementById('cursor-ring');
let mx = 0, my = 0, rx = 0, ry = 0;

document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

document.querySelectorAll('a, button, .dot').forEach(el => {
  el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
  el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
});

(function tick() {
  rx += (mx - rx) * 0.12;
  ry += (my - ry) * 0.12;
  cursor.style.left = mx + 'px';
  cursor.style.top  = my + 'px';
  ring.style.left   = rx + 'px';
  ring.style.top    = ry + 'px';
  requestAnimationFrame(tick);
})();

// ── ASCII hero background ──
const chars = '01▲△◆◇┼╋╌─│┃░▒▓';
const asciiEl = document.getElementById('ascii-bg');
let cols, rows, grid;

function buildAscii() {
  cols = Math.floor(window.innerWidth / 8.5);
  rows = Math.floor(window.innerHeight / 16);
  grid = Array.from({ length: rows }, () =>
    Array.from({ length: cols }, () => chars[Math.floor(Math.random() * chars.length)])
  );
  renderAscii();
}

function renderAscii() {
  asciiEl.textContent = grid.map(r => r.join('')).join('\n');
}

buildAscii();
window.addEventListener('resize', buildAscii);

// Animate a handful of cells per frame
setInterval(() => {
  const n = 8;
  for (let k = 0; k < n; k++) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    grid[r][c] = chars[Math.floor(Math.random() * chars.length)];
  }
  renderAscii();
}, 80);

// Parallax on mouse move
document.getElementById('hero').addEventListener('mousemove', e => {
  const dx = (e.clientX / window.innerWidth  - 0.5) * 18;
  const dy = (e.clientY / window.innerHeight - 0.5) * 18;
  asciiEl.style.transform = `translate(${dx}px, ${dy}px)`;
});
</script>
</body>
</html>
