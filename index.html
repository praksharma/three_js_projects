<html lang="en">
<head>
<meta charset="UTF-8">

<title>Three.js Projects — Prakhar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0a0a0a;
  --bg2:     #111111;
  --fg:      #f0ece4;
  --fg-dim:  #5a5652;
  --fg-mid:  #9a9490;
  --violet:  #7c3aed;
  --coral:   #ff4d2e;
  --rule:    rgba(240,236,228,0.07);
  --card-bg: #0f0f0f;
}

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Space Grotesk', sans-serif;
  overflow-x: hidden;
  cursor: none;
}

/* ── Cursor ── */
#cursor {
  position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
  width: 10px; height: 10px;
  background: var(--coral); border-radius: 50%;
  transform: translate(-50%,-50%);
  transition: width .15s, height .15s, background .15s;
}
#cursor.hover { width: 32px; height: 32px; background: var(--violet); mix-blend-mode: screen; }
#cursor-ring {
  position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9998;
  width: 32px; height: 32px;
  border: 1px solid rgba(240,236,228,0.2); border-radius: 50%;
  transform: translate(-50%,-50%);
}

/* ── Hero ── */
#hero {
  min-height: 52vh;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 3rem 4rem 2.5rem;
  position: relative; overflow: hidden;
  border-bottom: 1px solid var(--rule);
}

#hero-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none;
}

.hero-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: .68rem; letter-spacing: .2em; text-transform: uppercase;
  color: var(--coral); margin-bottom: 1rem;
  position: relative;
}

.hero-title {
  font-size: clamp(2.6rem, 7vw, 6rem);
  font-weight: 700; line-height: .92; letter-spacing: -.03em;
  margin-bottom: 1.4rem; position: relative;
}
.hero-title em { font-style: normal; color: var(--violet); }

.hero-stats {
  display: flex; gap: 2.5rem; align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: .7rem; color: var(--fg-mid);
  position: relative;
}
.hero-stats .stat { display: flex; flex-direction: column; gap: .15rem; }
.hero-stats .stat-val {
  font-size: 1.1rem; font-weight: 700;
  color: var(--fg); font-family: 'Space Grotesk', sans-serif;
}

/* ── Toolbar ── */
#toolbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
  padding: .9rem 4rem;
  display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
}
.search-wrap { position: relative; flex-shrink: 0; }
.search-wrap::before {
  content: '/';
  position: absolute; left: .75rem; top: 50%; transform: translateY(-50%);
  font-family: 'JetBrains Mono', monospace; font-size: .75rem; color: var(--fg-dim);
  pointer-events: none;
}
#search {
  background: var(--bg2); border: 1px solid var(--rule); border-radius: 3px;
  padding: .45rem .75rem .45rem 1.6rem;
  color: var(--fg); font-family: 'JetBrains Mono', monospace; font-size: .72rem;
  width: 200px; outline: none;
  transition: border-color .2s, width .3s;
}
#search:focus { border-color: var(--violet); width: 260px; }
#search::placeholder { color: var(--fg-dim); }

.filters { display: flex; gap: .4rem; flex-wrap: wrap; flex: 1; }
.pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: .62rem; letter-spacing: .1em; text-transform: uppercase;
  padding: .3rem .65rem; border: 1px solid var(--rule); border-radius: 2px;
  color: var(--fg-dim); background: transparent; cursor: none;
  transition: color .2s, border-color .2s, background .2s;
}
.pill:hover { color: var(--fg); border-color: rgba(240,236,228,0.2); }
.pill.active { color: var(--violet); border-color: var(--violet); background: rgba(124,58,237,0.08); }
.pill.all.active { color: var(--coral); border-color: var(--coral); background: rgba(255,77,46,0.08); }

#sort-select {
  margin-left: auto; background: transparent; border: 1px solid var(--rule);
  border-radius: 3px; color: var(--fg-dim);
  font-family: 'JetBrains Mono', monospace; font-size: .65rem; letter-spacing: .08em;
  padding: .35rem .5rem; outline: none; cursor: pointer; appearance: none;
}

/* ── Grid ── */
#grid-wrap { padding: 2rem 4rem 4rem; }
#results-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: .65rem; letter-spacing: .15em; text-transform: uppercase;
  color: var(--fg-dim); margin-bottom: 1.5rem;
}
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1px; background: var(--rule); border: 1px solid var(--rule);
}

/* ── Cards ── */
.card {
  background: var(--card-bg);
  display: flex; flex-direction: column;
  position: relative; overflow: hidden;
  transition: background .25s;
  text-decoration: none; color: inherit;
}
.card:hover { background: #141414; }

/* Left accent stripe */
.card::after {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 2px; background: var(--violet);
  transform: scaleY(0); transform-origin: bottom;
  transition: transform .35s cubic-bezier(0.16,1,0.3,1);
}
.card:hover::after { transform: scaleY(1); }

/* ── Thumbnail ── */
.card-thumb {
  width: 100%; height: 140px;
  position: relative; overflow: hidden;
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
}
.card-thumb canvas {
  position: absolute; inset: 0; width: 100% !important; height: 100% !important;
}

/* screenshot fallback */
.card-thumb img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; display: block;
}

.thumb-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 40%, rgba(10,10,10,0.7) 100%);
  pointer-events: none;
}

/* ── Card body ── */
.card-body { padding: 1.4rem 1.6rem; display: flex; flex-direction: column; gap: .65rem; flex: 1; }

.card-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: .62rem; letter-spacing: .15em; color: var(--fg-dim);
}
.card-title {
  font-size: 1.1rem; font-weight: 700;
  line-height: 1.15; letter-spacing: -.015em;
}
.card-desc {
  font-size: .83rem; line-height: 1.6; color: var(--fg-mid); flex: 1;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-footer { display: flex; align-items: center; margin-top: .4rem; }
.card-tags { display: flex; gap: .3rem; flex-wrap: wrap; }
.ctag {
  font-family: 'JetBrains Mono', monospace;
  font-size: .58rem; letter-spacing: .1em; text-transform: uppercase;
  padding: .18rem .45rem; border: 1px solid var(--rule); border-radius: 2px; color: var(--fg-dim);
}
.ctag.accent { border-color: rgba(124,58,237,0.4); color: var(--violet); }
.card-arrow {
  font-size: .9rem; color: var(--fg-dim);
  transition: transform .2s, color .2s;
  margin-left: auto; padding-left: .75rem; flex-shrink: 0;
}
.card:hover .card-arrow { transform: translateX(4px); color: var(--coral); }

/* ── Empty ── */
#empty {
  display: none; grid-column: 1/-1;
  padding: 4rem 2rem; text-align: center;
  font-family: 'JetBrains Mono', monospace; font-size: .8rem; color: var(--fg-dim);
}

/* ── Outro ── */
#outro {
  border-top: 1px solid var(--rule); padding: 3rem 4rem;
  display: flex; justify-content: space-between; align-items: flex-end;
}
.outro-copy { font-size: clamp(1.6rem, 3vw, 2.8rem); font-weight: 700; letter-spacing: -.025em; line-height: 1.05; }
.outro-copy em { font-style: normal; color: var(--coral); }
.outro-links { display: flex; gap: 1.5rem; }
.outro-links a {
  font-family: 'JetBrains Mono', monospace; font-size: .72rem; letter-spacing: .1em;
  color: var(--fg-dim); text-decoration: none;
  border-bottom: 1px solid var(--rule); padding-bottom: 2px;
  transition: color .2s, border-color .2s;
}
.outro-links a:hover { color: var(--fg); border-color: var(--fg); }

/* ── Reveal ── */
.reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s cubic-bezier(0.16,1,0.3,1), transform .6s cubic-bezier(0.16,1,0.3,1); }
.reveal.in { opacity: 1; transform: none; }
.reveal:nth-child(2) { transition-delay: .07s; }
.reveal:nth-child(3) { transition-delay: .14s; }

@media (max-width: 700px) {
  #hero, #grid-wrap, #outro, #toolbar { padding-left: 1.5rem; padding-right: 1.5rem; }
  #grid { grid-template-columns: 1fr; }
  .hero-stats { flex-wrap: wrap; gap: 1.2rem; }
  #outro { flex-direction: column; gap: 1.5rem; align-items: flex-start; }
  body { cursor: auto; }
  #cursor, #cursor-ring { display: none; }
}
</style>

<script>
// ─────────────────────────────────────────────────────────
//  ★  YOUR PROJECTS
//

//                 When set, shows the image instead of the animated canvas.
//    thumbStyle — one of: 'geometry' | 'shader' | 'particles' | 'lines' | 'wave'
//                 Controls the animated canvas style when no thumbnail image.
//                 Auto-detected from tags if omitted.
// ─────────────────────────────────────────────────────────
const PROJECTS = [
  {
    title: "Getting Started\nwith Three.js",
    description: "Exploring the fundamentals — scenes, cameras, geometries, and the render loop. The hello-world that kicked everything off.",
    tags: ["Three.js", "WebGL", "Geometry"],

  {

},
{

},
{

  description: "Physics Engine rendering using Rapier.",
  tags: ["Three.js", "Transition"],
  accentTag: "Shaders",
  href: "./physics_engine/index.html",
  year: "2026",
},
{

  description: "Create basic multiple scene animation in three.js.",
  tags: ["Three.js", "Plots"],
  accentTag: "Plots",
  href: "./multi_scene/index.html",
  year: "2026",
},
{
  title: "Intro to Plots",
  description: "Create basic 2D plots in three.js.",
  tags: ["Three.js", "Plots"],
  accentTag: "Plots",
  href: "./intro_plots/index.html",
  year: "2026",
},
{
  title: "Intro to Plots with THREE groups",
  description: "Create basic 2D plots in three.js.",
  tags: ["Three.js", "Plots"],
  accentTag: "Plots",
  href: "./intro_groups/index.html",
  year: "2026",
},
{
  title: "Wave visualiser: Modify primitive geometry",
  description: "Wave animation with GUI controls.",
  tags: ["Three.js", "Geometry"],
  accentTag: "Portfolio",
  href: "./modify_geometry/index.html",
  year: "2026",
},
{
  title: "Sample Portfolio",
  description: "Create basic portfolio in three.js.",
  tags: ["Three.js", "Portfolio"],
  accentTag: "Portfolio",
  href: "./sample_portfolio/index.html",
  year: "2026",
},
  // ── Add more below ──
  // {
  //   title: "Shader Noise",
  //   description: "Fragment shader experiments — fbm, domain warping, and animated noise fields.",
  //   tags: ["GLSL", "Shaders", "Three.js"],
  //   href: "./shader-noise/index.html",
  //   year: "2025",
  //   thumbnail: "./shader-noise/thumb.png",  // optional screenshot
  // },
];
// ─────────────────────────────────────────────────────────

// ══════════════════════════════════════════════════════════
//  HERO — WebGL: drifting wireframe icosahedra
// ══════════════════════════════════════════════════════════
(function initHero() {
  const canvas = document.getElementById('hero-canvas');
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) { canvas.style.display = 'none'; return; }

  function resize() {
    const r = window.devicePixelRatio || 1;
    canvas.width  = canvas.offsetWidth  * r;
    canvas.height = canvas.offsetHeight * r;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  resize();
  window.addEventListener('resize', resize);

  // ── Shaders ──
  const vert = `
    attribute vec3 aPos;
    uniform mat4 uMVP;
    void main() { gl_Position = uMVP * vec4(aPos, 1.0); }
  `;
  const frag = `
    precision mediump float;
    uniform float uAlpha;
    uniform vec3  uColor;
    void main() { gl_FragColor = vec4(uColor, uAlpha); }
  `;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s); return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(prog); gl.useProgram(prog);

  const aPos  = gl.getAttribLocation(prog, 'aPos');
  const uMVP  = gl.getUniformLocation(prog, 'uMVP');
  const uAlpha= gl.getUniformLocation(prog, 'uAlpha');
  const uColor= gl.getUniformLocation(prog, 'uColor');

  // ── Icosahedron geometry ──
  const t = (1 + Math.sqrt(5)) / 2;
  const icoVerts = [
    -1, t,0,  1,t,0,  -1,-t,0,  1,-t,0,
     0,-1,t,  0,1,t,   0,-1,-t, 0,1,-t,
     t, 0,1, -t,0,1,   t,0,-1, -t,0,-1,
  ].map((v,i) => { // normalise
    const l = Math.sqrt(icoVertsRaw(i));
    return v;
  });
  // rebuild properly
  function icoVertsRaw(i) { return [1+t*t, 1+t*t, 1+t*t, 1+t*t, 1+t*t, 1+t*t, 1+t*t, 1+t*t, 1+t*t, 1+t*t, 1+t*t, 1+t*t][Math.floor(i/3)]; }
  const raw = [-1,t,0, 1,t,0, -1,-t,0, 1,-t,0, 0,-1,t, 0,1,t, 0,-1,-t, 0,1,-t, t,0,1, -t,0,1, t,0,-1, -t,0,-1];
  const len = Math.sqrt(1 + t*t);
  const verts = raw.map(v => v / len);

  const faces = [
    0,11,5, 0,5,1, 0,1,7, 0,7,10, 0,10,11,
    1,5,9,  5,11,4, 11,10,2, 10,7,6, 7,1,8,
    3,9,4,  3,4,2,  3,2,6,  3,6,8,  3,8,9,
    4,9,5,  2,4,11, 6,2,10, 8,6,7,  9,8,1,
  ];

  // edges (deduplicated)
  const edgeSet = new Set();
  const edgeVerts = [];
  for (let i = 0; i < faces.length; i += 3) {
    const tri = [faces[i], faces[i+1], faces[i+2]];
    for (let j = 0; j < 3; j++) {
      const a = tri[j], b = tri[(j+1)%3];
      const key = Math.min(a,b)+','+Math.max(a,b);
      if (!edgeSet.has(key)) {
        edgeSet.add(key);
        edgeVerts.push(...verts.slice(a*3, a*3+3), ...verts.slice(b*3, b*3+3));
      }
    }
  }
  const edgeBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, edgeBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(edgeVerts), gl.STATIC_DRAW);

  // ── Instances ──
  const N = 18;
  const instances = Array.from({length: N}, (_, i) => ({
    x: (Math.random() - 0.5) * 4.5,
    y: (Math.random() - 0.5) * 3.0,
    z: -2 - Math.random() * 3,
    scale: 0.18 + Math.random() * 0.28,
    rx: Math.random() * Math.PI * 2,
    ry: Math.random() * Math.PI * 2,
    rz: Math.random() * Math.PI * 2,
    vx: (Math.random() - 0.5) * 0.0003,
    vy: (Math.random() - 0.5) * 0.0002,
    vrx: (Math.random() - 0.5) * 0.004,
    vry: (Math.random() - 0.5) * 0.005,
    alpha: 0.12 + Math.random() * 0.22,
    violet: Math.random() > 0.55,
  }));

  // ── Matrix helpers ──
  function mat4() { return new Float32Array(16); }
  function identity(m) { m.fill(0); m[0]=m[5]=m[10]=m[15]=1; return m; }
  function perspective(m, fov, asp, near, far) {
    const f = 1/Math.tan(fov/2);
    m.fill(0);
    m[0]=f/asp; m[5]=f;
    m[10]=(far+near)/(near-far); m[14]=(2*far*near)/(near-far);
    m[11]=-1; return m;
  }
  function translate(m, x, y, z) {
    const r = mat4(); identity(r);
    r[12]=x; r[13]=y; r[14]=z;
    return mul(r, m);
  }
  function scale(m, s) {
    const r = mat4(); identity(r);
    r[0]=r[5]=r[10]=s;
    return mul(r, m);
  }
  function rotX(m, a) {
    const r = mat4(); identity(r);
    r[5]=Math.cos(a); r[6]=Math.sin(a); r[9]=-Math.sin(a); r[10]=Math.cos(a);
    return mul(r, m);
  }
  function rotY(m, a) {
    const r = mat4(); identity(r);
    r[0]=Math.cos(a); r[2]=-Math.sin(a); r[8]=Math.sin(a); r[10]=Math.cos(a);
    return mul(r, m);
  }
  function mul(a, b) {
    const o = mat4();
    for (let i=0;i<4;i++) for (let j=0;j<4;j++) {
      let s=0; for(let k=0;k<4;k++) s+=a[i+k*4]*b[k+j*4]; o[i+j*4]=s;
    }
    return o;
  }

  let mouseX = 0, mouseY = 0;
  document.addEventListener('mousemove', e => {
    mouseX = (e.clientX / window.innerWidth  - 0.5) * 0.6;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 0.4;
  });

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  const proj = mat4();
  let t0 = performance.now();

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = now - t0; t0 = now;

    gl.clearColor(0.039, 0.039, 0.039, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    const asp = canvas.width / canvas.height;
    perspective(proj, 1.0, asp, 0.1, 20);

    gl.bindBuffer(gl.ARRAY_BUFFER, edgeBuf);
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

    instances.forEach(inst => {
      inst.rx += inst.vrx * dt;
      inst.ry += inst.vry * dt;
      inst.x  += inst.vx  * dt;
      inst.y  += inst.vy  * dt;
      if (inst.x >  2.5) inst.vx *= -1;
      if (inst.x < -2.5) inst.vx *= -1;
      if (inst.y >  1.6) inst.vy *= -1;
      if (inst.y < -1.6) inst.vy *= -1;

      let m = mat4(); identity(m);
      m = rotX(m, inst.rx + mouseY * 0.5);
      m = rotY(m, inst.ry + mouseX * 0.5);
      m = scale(m, inst.scale);
      m = translate(m, inst.x, inst.y, inst.z);
      m = mul(proj, m);

      gl.uniformMatrix4fv(uMVP, false, m);
      gl.uniform1f(uAlpha, inst.alpha);
      if (inst.violet) gl.uniform3f(uColor, 0.486, 0.227, 0.929); // violet
      else             gl.uniform3f(uColor, 0.878, 0.502, 0.376); // warm
      gl.drawArrays(gl.LINES, 0, edgeVerts.length / 3);
    });
  }
  requestAnimationFrame(frame);
})();

// ══════════════════════════════════════════════════════════
//  CARD THUMBNAILS — per-tag animated 2D canvas
// ══════════════════════════════════════════════════════════

// All available thumbnail styles
const ALL_STYLES = ['geometry','shader','particles','lines','wave','grid','rings','scan'];

// Seeded hash so each project keeps the same style across re-filters
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0;
  return Math.abs(h);
}

function thumbStyleFor(project) {
  if (project.thumbStyle) return project.thumbStyle;
  // tag hints still take priority
  const tags = project.tags.map(t => t.toLowerCase());
  if (tags.some(t => ['glsl','shader','shaders','fragment'].includes(t))) return 'shader';
  if (tags.some(t => ['particle','particles','points'].includes(t))) return 'particles';
  if (tags.some(t => ['line','lines','graph','network'].includes(t))) return 'lines';
  if (tags.some(t => ['wave','audio','sound','music'].includes(t))) return 'wave';
  // otherwise: deterministic random from title
  const pool = ALL_STYLES.filter(s => !['shader'].includes(s)); // shader stays opt-in
  return pool[hashStr(project.title) % pool.length];
}

// Registry of running thumbnail animators; paused when not hovered
const thumbAnimators = new Map();

function makeThumbCanvas(project, container) {
  if (project.thumbnail) {
    const img = document.createElement('img');
    img.src = project.thumbnail;
    img.alt = project.title;
    container.appendChild(img);
    const ov = document.createElement('div');
    ov.className = 'thumb-overlay';
    container.appendChild(ov);
    return;
  }

  const cv = document.createElement('canvas');
  container.appendChild(cv);
  const ov = document.createElement('div');
  ov.className = 'thumb-overlay';
  container.appendChild(ov);

  const style = thumbStyleFor(project);
  const ctx = cv.getContext('2d');
  let raf = null;
  let running = false;
  let t = Math.random() * 100;

  function resize() {
    cv.width  = container.offsetWidth;
    cv.height = container.offsetHeight;
  }
  resize();

  // ── Animators ──
  const VIOLET = '#7c3aed', CORAL = '#ff4d2e', DIM = 'rgba(124,58,237,0.25)';
  function bg() { ctx.fillStyle='#0a0a0a'; ctx.fillRect(0,0,cv.width,cv.height); }
  function guard() { if (!cv.width || !cv.height) { resize(); return true; } return false; }

  // 1. GEOMETRY — dual rotating polygons
  function drawGeometry() {
    if (guard()) return;
    const w=cv.width, h=cv.height, cx=w/2, cy=h/2, r=Math.min(w,h)*0.32;
    ctx.clearRect(0,0,w,h); bg();
    ctx.strokeStyle=VIOLET; ctx.lineWidth=1; ctx.globalAlpha=0.7;
    ctx.beginPath();
    for(let i=0;i<6;i++){const a=t*0.4+i*Math.PI/3; i?ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}
    ctx.closePath(); ctx.stroke();
    ctx.strokeStyle=CORAL; ctx.globalAlpha=0.45;
    ctx.beginPath();
    for(let i=0;i<6;i++){const a=-t*0.6+i*Math.PI/3+Math.PI/6; i?ctx.lineTo(cx+Math.cos(a)*r*.55,cy+Math.sin(a)*r*.55):ctx.moveTo(cx+Math.cos(a)*r*.55,cy+Math.sin(a)*r*.55);}
    ctx.closePath(); ctx.stroke();
    ctx.strokeStyle='rgba(124,58,237,0.2)'; ctx.globalAlpha=1;
    for(let i=0;i<6;i++){
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(t*0.4+i*Math.PI/3)*r, cy+Math.sin(t*0.4+i*Math.PI/3)*r);
      ctx.lineTo(cx+Math.cos(-t*0.6+i*Math.PI/3+Math.PI/6)*r*.55, cy+Math.sin(-t*0.6+i*Math.PI/3+Math.PI/6)*r*.55);
      ctx.stroke();
    }
  }

  // 2. SHADER — per-pixel noise (lazy: only on hover)
  function drawShader() {
    if (!cv.width || !cv.height) resize();
    const w=cv.width, h=cv.height; if(!w||!h) return;
    const id=ctx.createImageData(w,h), d=id.data;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const nx=x/w, ny=y/h;
      const v=Math.sin(nx*8+t*0.7)*Math.cos(ny*6-t*0.5)+0.5*Math.sin(nx*16-t+ny*12)+0.25*Math.cos((nx+ny)*20+t*1.2);
      const n=(v+2)/4, i=(y*w+x)*4;
      d[i]=Math.floor(n*255*.9+(1-n)*124*.4); d[i+1]=Math.floor(n*77*.3+(1-n)*58*.5);
      d[i+2]=Math.floor(n*46*.2+(1-n)*237*.6); d[i+3]=220;
    }
    ctx.putImageData(id,0,0);
  }

  // 3. PARTICLES — drifting dots + proximity edges
  let particles=Array.from({length:60},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0008,vy:(Math.random()-.5)*.0006,r:1+Math.random()*2,violet:Math.random()>.5}));
  function drawParticles() {
    if (guard()) return;
    const w=cv.width,h=cv.height;
    ctx.fillStyle='rgba(10,10,10,0.25)'; ctx.fillRect(0,0,w,h);
    particles.forEach(p=>{p.x=(p.x+p.vx+1)%1;p.y=(p.y+p.vy+1)%1;ctx.beginPath();ctx.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx.fillStyle=p.violet?VIOLET:CORAL;ctx.globalAlpha=.8;ctx.fill();ctx.globalAlpha=1;});
    ctx.lineWidth=.5;
    for(let i=0;i<particles.length;i++) for(let j=i+1;j<particles.length;j++){
      const dx=(particles[i].x-particles[j].x)*w,dy=(particles[i].y-particles[j].y)*h,d=Math.sqrt(dx*dx+dy*dy);
      if(d<55){ctx.strokeStyle=VIOLET;ctx.globalAlpha=(1-d/55)*.4;ctx.beginPath();ctx.moveTo(particles[i].x*w,particles[i].y*h);ctx.lineTo(particles[j].x*w,particles[j].y*h);ctx.stroke();ctx.globalAlpha=1;}
    }
  }

  // 4. LINES — floating node graph
  let lineNodes=Array.from({length:12},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0006,vy:(Math.random()-.5)*.0005}));
  function drawLines() {
    if (guard()) return;
    const w=cv.width,h=cv.height;
    ctx.fillStyle='rgba(10,10,10,0.18)'; ctx.fillRect(0,0,w,h);
    lineNodes.forEach(n=>{n.x=(n.x+n.vx+1)%1;n.y=(n.y+n.vy+1)%1;});
    for(let i=0;i<lineNodes.length;i++) for(let j=i+1;j<lineNodes.length;j++){
      const a=lineNodes[i],b=lineNodes[j],dx=(a.x-b.x)*w,dy=(a.y-b.y)*h,d=Math.sqrt(dx*dx+dy*dy);
      if(d<90){ctx.strokeStyle=VIOLET;ctx.lineWidth=.8;ctx.globalAlpha=(1-d/90)*.6;ctx.beginPath();ctx.moveTo(a.x*w,a.y*h);ctx.lineTo(b.x*w,b.y*h);ctx.stroke();}
    }
    lineNodes.forEach(n=>{ctx.beginPath();ctx.arc(n.x*w,n.y*h,2,0,Math.PI*2);ctx.fillStyle=CORAL;ctx.globalAlpha=.9;ctx.fill();ctx.globalAlpha=1;});
  }

  // 5. WAVE — stacked sine layers
  function drawWave() {
    if (guard()) return;
    const w=cv.width,h=cv.height; bg();
    for(let layer=0;layer<3;layer++){
      const amp=(h*.18)*(1-layer*.25),freq=(2+layer)*1.2,phase=t*(.6+layer*.3)+layer*1.1;
      ctx.beginPath();
      for(let x=0;x<=w;x++){const y=h*.5+Math.sin(x/w*Math.PI*freq+phase)*amp+Math.sin(x/w*Math.PI*freq*2.1-phase*.7)*amp*.4;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}
      ctx.strokeStyle=layer===0?VIOLET:layer===1?CORAL:DIM;ctx.lineWidth=1.5-layer*.4;ctx.globalAlpha=.8-layer*.2;ctx.stroke();ctx.globalAlpha=1;
    }
  }

  // 6. GRID — perspective dot grid with ripple
  function drawGrid() {
    if (guard()) return;
    const w=cv.width,h=cv.height; ctx.clearRect(0,0,w,h); bg();
    const cols=14,rows=8,cx=w/2,cy=h/2;
    for(let row=0;row<rows;row++) for(let col=0;col<cols;col++){
      const nx=(col/(cols-1)-.5)*2, ny=(row/(rows-1)-.5)*2;
      const dist=Math.sqrt(nx*nx+ny*ny);
      const z=1+.3*Math.sin(dist*4-t*2);
      const px=cx+nx*w*.45/z, py=cy+ny*h*.45/z;
      const r=Math.max(0.5,(2.5-dist)*.8)/z;
      const pulse=.4+.4*Math.sin(dist*3-t*2);
      ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2);
      ctx.fillStyle=col%3===0?CORAL:VIOLET; ctx.globalAlpha=pulse; ctx.fill(); ctx.globalAlpha=1;
    }
  }

  // 7. RINGS — concentric pulsing circles
  function drawRings() {
    if (guard()) return;
    const w=cv.width,h=cv.height,cx=w/2,cy=h/2; ctx.clearRect(0,0,w,h); bg();
    const maxR=Math.min(w,h)*.48;
    for(let i=0;i<6;i++){
      const phase=t*.8+i*1.1;
      const r=maxR*((i+1)/6);
      const pulse=.5+.5*Math.sin(phase);
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle=i%2===0?VIOLET:CORAL;
      ctx.lineWidth=.8+pulse*.8;
      ctx.globalAlpha=.1+pulse*.35;
      ctx.stroke(); ctx.globalAlpha=1;
    }
    // rotating tick marks on outermost ring
    for(let i=0;i<12;i++){
      const a=t*.3+i*Math.PI/6;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*maxR*.82,cy+Math.sin(a)*maxR*.82);
      ctx.lineTo(cx+Math.cos(a)*maxR*.95,cy+Math.sin(a)*maxR*.95);
      ctx.strokeStyle=CORAL; ctx.lineWidth=1; ctx.globalAlpha=.5; ctx.stroke(); ctx.globalAlpha=1;
    }
  }

  // 8. SCAN — horizontal scan line / oscilloscope
  function drawScan() {
    if (guard()) return;
    const w=cv.width,h=cv.height; ctx.clearRect(0,0,w,h); bg();
    // fading trail
    ctx.fillStyle='rgba(10,10,10,0.12)'; ctx.fillRect(0,0,w,h);
    // grid lines
    ctx.strokeStyle='rgba(124,58,237,0.08)'; ctx.lineWidth=.5;
    for(let y=0;y<h;y+=h/6){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    for(let x=0;x<w;x+=w/8){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    // oscilloscope trace
    ctx.beginPath();
    for(let x=0;x<=w;x++){
      const nx=x/w;
      const y=h*.5
        +h*.18*Math.sin(nx*Math.PI*4+t*2.5)
        +h*.08*Math.sin(nx*Math.PI*9-t*1.7)
        +h*.04*Math.cos(nx*Math.PI*17+t*3.1);
      x?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.strokeStyle=VIOLET; ctx.lineWidth=1.5; ctx.globalAlpha=.9; ctx.stroke(); ctx.globalAlpha=1;
    // moving scan line
    const scanX=(t*0.4*w/Math.PI)%w;
    const grad=ctx.createLinearGradient(scanX-40,0,scanX+8,0);
    grad.addColorStop(0,'rgba(255,77,46,0)');
    grad.addColorStop(1,'rgba(255,77,46,0.6)');
    ctx.fillStyle=grad; ctx.fillRect(scanX-40,0,48,h);
  }

  const draws = {geometry:drawGeometry,shader:drawShader,particles:drawParticles,lines:drawLines,wave:drawWave,grid:drawGrid,rings:drawRings,scan:drawScan};
  const draw = draws[style] || drawGeometry;

  const SPEED = {geometry:.012,shader:.018,particles:.016,lines:.014,wave:.020,grid:.015,rings:.013,scan:.022};
  const speed = SPEED[style] || .014;

  // shader is pixel-heavy; only run when hovered
  const lazyStart = style === 'shader';

  function loop() {
    if (!running) return;
    t += speed;
    draw();
    raf = requestAnimationFrame(loop);
  }

  function start() {
    if (running) return;
    running = true;
    // Force layout flush before first draw — canvas may still be 0×0
    // when called synchronously from a requestAnimationFrame callback.
    resize();
    if (!cv.width || !cv.height) {
      // Try again after one more paint cycle
      requestAnimationFrame(() => { resize(); loop(); });
    } else {
      loop();
    }
  }
  function stop() {
    running = false;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
  }

  if (!lazyStart) start(); // run geometry/particles/lines/wave always

  thumbAnimators.set(cv, { start, stop, isLazy: lazyStart });

  return { start, stop };
}

// ══════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════
let activeTag = 'all', searchQuery = '', sortMode = 'newest';

const allTags = [...new Set(PROJECTS.flatMap(p => p.tags))].sort();

document.getElementById('stat-total').textContent = PROJECTS.length;
document.getElementById('stat-tags').textContent = allTags.length;
const years = PROJECTS.map(p => parseInt(p.year)).filter(Boolean);
document.getElementById('stat-latest').textContent = years.length ? Math.max(...years) : '—';

// Filters
const filtersEl = document.getElementById('filters');
allTags.forEach(tag => {
  const btn = document.createElement('button');
  btn.className = 'pill'; btn.dataset.tag = tag; btn.textContent = tag;
  btn.addEventListener('click', () => setTag(tag));
  filtersEl.appendChild(btn);
});
function setTag(tag) {
  activeTag = tag;
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.tag === tag));
  render();
}
filtersEl.querySelector('.pill.all').addEventListener('click', () => setTag('all'));

// Search
const searchEl = document.getElementById('search');
searchEl.addEventListener('input', () => { searchQuery = searchEl.value.toLowerCase(); render(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchEl) { e.preventDefault(); searchEl.focus(); }
  if (e.key === 'Escape') { searchEl.blur(); searchQuery = ''; searchEl.value = ''; render(); }
});

// Sort
document.getElementById('sort-select').addEventListener('change', e => { sortMode = e.target.value; render(); });

// ── Render ──
const gridEl   = document.getElementById('grid');
const emptyEl  = document.getElementById('empty');
const labelEl  = document.getElementById('results-label');

function sortedFiltered() {
  let list = PROJECTS.filter(p => {
    const tagMatch = activeTag === 'all' || p.tags.includes(activeTag);
    const q = searchQuery;
    const textMatch = !q || p.title.toLowerCase().includes(q) || p.description.toLowerCase().includes(q) || p.tags.some(t => t.toLowerCase().includes(q));
    return tagMatch && textMatch;
  });
  if (sortMode==='newest') list.sort((a,b)=>parseInt(b.year)-parseInt(a.year));
  else if (sortMode==='oldest') list.sort((a,b)=>parseInt(a.year)-parseInt(b.year));
  else if (sortMode==='alpha') list.sort((a,b)=>a.title.localeCompare(b.title));
  return list;
}

function render() {
  gridEl.querySelectorAll('.card').forEach(c => c.remove());
  const list = sortedFiltered();
  labelEl.textContent = `${list.length} of ${PROJECTS.length} project${PROJECTS.length!==1?'s':''}`;

  if (list.length === 0) { emptyEl.style.display = 'block'; return; }
  emptyEl.style.display = 'none';

  list.forEach((p, i) => {
    const idx = PROJECTS.indexOf(p) + 1;

    const card = document.createElement('a');
    card.className = 'card';
    card.href = p.href; card.target = '_blank'; card.rel = 'noopener';

    // ── Thumbnail wrapper — built before innerHTML touches the card ──
    const thumb = document.createElement('div');
    thumb.className = 'card-thumb';
    card.appendChild(thumb);

    // ── Card body via DOM (never use innerHTML+= — it nukes thumb) ──
    const body = document.createElement('div');
    body.className = 'card-body';

    const num = document.createElement('span');
    num.className = 'card-num';
    num.textContent = String(idx).padStart(2,'0') + ' · ' + p.year;

    const titleEl = document.createElement('h2');
    titleEl.className = 'card-title';
    titleEl.textContent = p.title;

    const desc = document.createElement('p');
    desc.className = 'card-desc';
    desc.textContent = p.description;

    const footer = document.createElement('div');
    footer.className = 'card-footer';

    const tagsWrap = document.createElement('div');
    tagsWrap.className = 'card-tags';
    p.tags.forEach((t, ti) => {
      const s = document.createElement('span');
      s.className = 'ctag' + (ti === 0 ? ' accent' : '');
      s.textContent = t;
      tagsWrap.appendChild(s);
    });

    const arrow = document.createElement('span');
    arrow.className = 'card-arrow';
    arrow.textContent = '\u2192';

    footer.appendChild(tagsWrap);
    footer.appendChild(arrow);
    body.appendChild(num);
    body.appendChild(titleEl);
    body.appendChild(desc);
    body.appendChild(footer);
    card.appendChild(body);

    gridEl.insertBefore(card, emptyEl);

    // ── Animate thumbnail: double-rAF so card has real layout dimensions ──
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const anim = makeThumbCanvas(p, thumb);
      if (anim) {
        const isShader = thumbStyleFor(p) === 'shader';
        card.addEventListener('mouseenter', () => anim.start());
        card.addEventListener('mouseleave', () => { if (isShader) anim.stop(); });
      }
    }));

    // cursor
    card.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    card.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });
}

render();

// ══════════════════════════════════════════════════════════
//  CURSOR
// ══════════════════════════════════════════════════════════
const cursor = document.getElementById('cursor');
const ring   = document.getElementById('cursor-ring');
let mx=0, my=0, rx=0, ry=0;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
document.querySelectorAll('a,button,select,input').forEach(el=>{
  el.addEventListener('mouseenter',()=>cursor.classList.add('hover'));
  el.addEventListener('mouseleave',()=>cursor.classList.remove('hover'));
});
(function tick(){
  rx+=(mx-rx)*0.1; ry+=(my-ry)*0.1;
  cursor.style.left=mx+'px'; cursor.style.top=my+'px';
  ring.style.left=rx+'px';   ring.style.top=ry+'px';
  requestAnimationFrame(tick);
})();

// ══════════════════════════════════════════════════════════
//  REVEAL
// ══════════════════════════════════════════════════════════
const revObs = new IntersectionObserver(entries=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); });
},{threshold:0.1});
document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));
</script>
</body>
