<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GASP intro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="box1">
        <h1>Box 1</h1>
        <h2>Sequential timeline</h2>
    </div>
    <div id="box2">
        <h1>Box 2</h1>
        <h2>Animation don't start at the same time.</h2>
    </div>
    <div id="nav">
        <h2>Animation to entire navbar</h2>
        <div id="submenu">
            <h4>Work</h4>
            <h4>About</h4>
            <h4>courses</h4>
            <h4>Contacts</h4>
        </div>
    </div>
    <div id="nav2">
        <h2>Animation to separate elements in the navbar</h2>
        <div id="submenu2">
            <h4>Work</h4>
            <h4>About</h4>
            <h4>courses</h4>
            <h4>Contacts</h4>
        </div>
    </div>
    <div id="centreContent">
        <h1>Centre content</h1>
        <h1>Something here</h1>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
        integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js "></script>
</body>

</html>
